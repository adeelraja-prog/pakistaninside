
name: 24/7 Pakistan Inside Newsroom Automation

on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: "Run safe checks only (no Gemini call or Facebook post)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pakistan-inside-newsroom
  cancel-in-progress: false

jobs:
  run-newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Urdu Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core
          sudo fc-cache -f

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Files
        run: |
          python -m compileall -q .

      - name: Verify Urdu Rendering
        run: |
          python - <<'PY'
          import os
          from PIL import ImageFont, features

          font_path = "/usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf"

          print("RAQM support:", features.check("raqm"))
          print("Noto Urdu font exists:", os.path.isfile(font_path))

          if not features.check("raqm"):
              raise SystemExit("FAIL: Pillow is missing RAQM support.")

          if not os.path.isfile(font_path):
              raise SystemExit("FAIL: Noto Naskh Arabic font was not installed.")

          font = ImageFont.truetype(
              font_path,
              40,
              layout_engine=ImageFont.Layout.RAQM
          )

          print("PASS: Urdu font loaded with RAQM.")
          PY

      - name: Run Newsroom Engine
        if: ${{ inputs.preflight_only == false }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GEMINI_MODEL: gemini-3.8-flash
          FACEBOOK_GRAPH_API_VERSION: v26.0
          PUBLISH_TO_FACEBOOK: "true"
        run: |
          python main.py

      - name: Save Generated Poster
        if: always() && inputs.preflight_only == false
        uses: actions/upload-artifact@v4
        with:
          name: pakistan-inside-poster
          path: assets/output/latest_news_card.png
          if-no-files-found: warn
          retention-days: 7

      - name: Confirm Preflight Completed
        if: ${{ inputs.preflight_only == true }}
        run: |
          echo "Preflight passed. Gemini was not called."
          echo "Facebook was not contacted."
