
name: 24/7 Pakistan Inside Newsroom Automation

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: read

concurrency:
  group: pakistan-inside-newsroom
  cancel-in-progress: false

jobs:
  run-newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Urdu Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core
          sudo fc-cache -f

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Urdu Font
        run: |
          fc-match "Noto Naskh Arabic"
          python -c "from PIL import features; print('RAQM support:', features.check('raqm'))"

      - name: Run Newsroom Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GEMINI_MODEL: gemini-3.8-flash
          FACEBOOK_GRAPH_API_VERSION: v26.0
        run: |
          python main.py
