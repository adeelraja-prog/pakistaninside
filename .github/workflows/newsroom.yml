name: Pakistan Inside Newsroom

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Facebook"
        required: false
        default: "false"
        type: boolean

jobs:
  newsroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core
          fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsroom
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PUBLISH_TO_FACEBOOK: ${{ github.event.inputs.publish }}
          GEMINI_MODEL: gemini-2.0-flash
        run: python main.py

      - name: Upload poster
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-poster
          path: assets/output/latest_news_card.png
          retention-days: 7
