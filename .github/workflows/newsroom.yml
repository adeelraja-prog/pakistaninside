name: Adeel Raja Newsroom

on:
  workflow_dispatch:
    inputs:
      publish_facebook:
        description: "Publish posters to Facebook (false for dry-run)"
        required: false
        default: false
        type: boolean
      publish_youtube:
        description: "Upload Shorts to YouTube (requires OAuth secrets)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read

concurrency:
  group: adeel-raja-newsroom
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Urdu fonts and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core libraqm0 ffmpeg
          fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run newsroom
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PUBLISH_TO_FACEBOOK: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_facebook || false }}
          PUBLISH_TO_YOUTUBE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_youtube || false }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          URDU_TTS_VOICE: ur-PK-UzmaNeural
        run: python main.py

      - name: Upload newsroom outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adeel-raja-newsroom-outputs
          path: |
            assets/output/*.jpg
            assets/videos/*.mp4
          if-no-files-found: ignore
          retention-days: 7
