name: Adeel Raja Newsroom

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Facebook (keep false for testing)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read

concurrency:
  group: adeel-raja-newsroom
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Urdu fonts and rendering support
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core libraqm0
          fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run newsroom
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PUBLISH_TO_FACEBOOK: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python main.py

      - name: Upload generated posters
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adeel-raja-newsroom-posters
          path: assets/output/*.jpg
          if-no-files-found: ignore
          retention-days: 7
