name: Pakistan Inside Newsroom

on:
  schedule:
    - cron: '0,45 * * * *'
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Facebook"
        required: false
        default: "false"
        type: boolean

jobs:
  newsroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fonts-dejavu-core
          fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsroom
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PUBLISH_TO_FACEBOOK: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python main.py

      - name: Upload poster
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pakistan-inside-posters
          path: assets/output/*.png
          if-no-files-found: warn
          retention-days: 7
