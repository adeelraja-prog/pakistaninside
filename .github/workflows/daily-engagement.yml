name: Adeel Raja Daily Engagement

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish daily poll to Facebook (requires pages_manage_posts permission)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  daily-poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare and optionally publish poll
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PUBLISH_DAILY_POLL: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || vars.ENABLE_DAILY_POLL || false }}
        run: python -m engine.daily_poll
      - name: Upload poll draft
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adeel-raja-daily-poll
          path: assets/output/daily_poll.json
          if-no-files-found: ignore
          retention-days: 7
